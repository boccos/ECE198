<head>
    <meta charset="UTF-8">
    <title>ECE 198</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/password/logOut.js" defer></script>
    <script src="js/password/authentication.js" defer></script>
    <script src="js/patientSelection.js" type="module" defer></script>
    <script src="js/toggleViewMode.js" defer></script>
    <meta charset="UTF-8">
    <title>ECE 198</title>
</head>

<body>
    <div id="password-protected" hidden>
        <header>
            <div class="header">
                <nav>
                    <img id="logo" src="/WHRN.png" alt="WHRN Logo">
                    <div id="header-logo">WHRN</div>
                    <button onclick="window.location.href='patients.html'">Patients</button>
                    <button onclick="window.location.href='heartrate.html'">Heart Rate</button>
                    <button onclick="window.location.href='spo2.html'">SPO2</button>
                    <button onclick="window.location.href='infrared.html'">Infrared</button>
                    <button onclick="window.location.href='sleep-logs.html'">Sleep Logs</button>
                    <button onclick="window.location.href='LED.html'">Light Control</button>
                    <button id="toggleViewMode">🌙</button>
                    <button id="logoutBtn">Logout</button>
                </nav>
            </div>
        </header>
        <h2>Select a Patient</h2>

        <label for="patient-select">Choose a patient:</label>
        <select id="patient-select">
            <option value="" disabled selected hidden>-- Select a Patient --</option>
        </select>
        <h2>Add a Patient</h2>

        <form id="patient-form">
            <h3>Please input information below</h3>
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" required><br><br>

            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" required><br><br>

            <button type="submit" id="begin-collection" hidden>Begin Data Collection!</button>
            <button type="submit" id="end-collection" hidden>End Data Collection!</button>
        </form>
        <div id="password-protected-warning" hidden>
            <h1>Please log into the application</h1>
            <button onclick="window.location.href='index.html'">Login Page</button>
        </div>
    </div>
    <div id="password-protected-warning" hidden>
        <h1>Please log into the application</h1>
        <button onclick="window.location.href='index.html'">Login Page</button>
    </div>
</body>

</html>
